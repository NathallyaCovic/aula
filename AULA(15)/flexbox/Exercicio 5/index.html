<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      background-color: #f2f2f2;
      justify-content: center;
      align-items: center;
    }

    .linha {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .container {
      background-color: black;
      height: 100px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="linha">
    <div class="container">1</div>
    <div class="container">2</div>
    <div class="container">3</div>
  </div>
</body>
</html>
